<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><title>Chrome Control 安全测试页</title>
<style>body{font:18px system-ui;max-width:720px;margin:100px auto;padding:24px;background:#f8fafc;color:#1e293b}input,button{font:inherit;padding:12px;border:1px solid #cbd5e1;border-radius:8px}section{padding:28px;background:white;border-radius:16px;margin-bottom:24px}label{display:block;margin-bottom:12px}</style>
<h1 id="demo-title">Chrome Control 测试页</h1>
<p>不连接账户、不付款，用于验证指针、高亮和人工接管。</p>
<section><label for="name">测试文字</label><input id="name" type="text" placeholder="请让 AI 输入测试文字"></section>
<section><button id="increment" onclick="document.getElementById('count').textContent=++window.counter">增加计数</button><p>当前计数：<output id="count">0</output></p></section>
<section><h2>Shadow DOM 检查</h2><div id="open-demo"></div><div id="closed-demo"></div></section>
<section><h2>iframe 检查</h2><iframe title="嵌入式测试内容" src="demo-frame.html" style="width:100%;height:220px;border:1px solid #cbd5e1"></iframe></section>
<script>
window.counter=0;
document.getElementById('open-demo').attachShadow({mode:'open'}).innerHTML='<h3>开放组件标题</h3><button type="button">开放组件按钮</button>';
document.getElementById('closed-demo').attachShadow({mode:'closed'}).innerHTML='<h3>封闭组件标题</h3><button type="button">封闭组件按钮</button>';
</script>
</html>
